    <script>
      // Global Error Handler for debugging "Uncaught" errors
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("[Global Error Caught]:", message, "Source:", source, "Line:", lineno, "Error:", error);
        return false; // Let default handler run as well
      };

      // Polyfills for browser environment to prevent "Uncaught ReferenceError"
      window.global = window;
      window.process = window.process || { env: { NODE_ENV: 'development' } };
    </script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Default base styles handled by Tailwind dark mode classes */
        overflow: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #a1a1aa; /* gray-400 */
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #18181b;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #3f3f46;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
